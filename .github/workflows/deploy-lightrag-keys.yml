name: Deploy LightRAG API Keys

# Aggiorna il pool di chiavi Google API usato dal proxy Gemini locale.
# La rotazione avviene in modo reattivo: la chiave corrente viene usata per
# le richieste reali; solo su HTTP 429 il proxy ruota a una chiave casuale
# e riprova la stessa richiesta — nessun test preventivo, zero quota sprecata.
#
# GitHub Secrets da configurare (Settings → Secrets and variables → Actions):
#   GOOGLE_API_KEY_1  ← chiave principale (obbligatoria)
#   GOOGLE_API_KEY_2  ← alternativa (opzionale)
#   GOOGLE_API_KEY_3  ← alternativa (opzionale)
#   GOOGLE_API_KEY_4  ← alternativa (opzionale)
#   GOOGLE_API_KEY_5  ← alternativa (opzionale)
#
# Secrets infrastruttura già presenti: VM_HOST, VM_USER, SSH_PRIVATE_KEY

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy-lightrag-keys.yml'

jobs:
  deploy-keys:
    name: Aggiorna pool chiavi Google API su VM
    runs-on: ubuntu-latest

    steps:
      - name: Valida che almeno GOOGLE_API_KEY_1 sia configurata
        run: |
          if [ -z "${{ secrets.GOOGLE_API_KEY_1 }}" ]; then
            echo "::error::GOOGLE_API_KEY_1 non configurata nei GitHub Secrets."
            echo "::error::Vai su: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "✓ GOOGLE_API_KEY_1 presente"
          count=1
          [ -n "${{ secrets.GOOGLE_API_KEY_2 }}" ] && count=$((count+1)) && echo "✓ GOOGLE_API_KEY_2 presente"
          [ -n "${{ secrets.GOOGLE_API_KEY_3 }}" ] && count=$((count+1)) && echo "✓ GOOGLE_API_KEY_3 presente"
          [ -n "${{ secrets.GOOGLE_API_KEY_4 }}" ] && count=$((count+1)) && echo "✓ GOOGLE_API_KEY_4 presente"
          [ -n "${{ secrets.GOOGLE_API_KEY_5 }}" ] && count=$((count+1)) && echo "✓ GOOGLE_API_KEY_5 presente"
          echo "Pool totale: $count chiave/i"

      - name: Deploy pool chiavi sul server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: KEY1,KEY2,KEY3,KEY4,KEY5
          script: |
            set -euo pipefail

            KEYS_CONF="$HOME/.hermes/lightrag/google-api-keys.conf"
            mkdir -p "$(dirname "$KEYS_CONF")" "$HOME/.hermes/lightrag/logs"

            echo "── Scrittura pool chiavi Google API ──"
            {
              echo "# Google API Keys — pool per rotazione reattiva su 429"
              echo "# Aggiornato il $(date -u '+%Y-%m-%d %H:%M UTC') dal workflow GitHub"
              echo "# NON modificare manualmente — usa il workflow 'Deploy LightRAG API Keys'"
              echo "# ─────────────────────────────────────────────────────────────────────"
              idx=1
              for key in ${KEY1} ${KEY2} ${KEY3} ${KEY4} ${KEY5}; do
                if [ "$key" != "SKIP" ] && [ -n "$key" ]; then
                  echo "$key"
                  echo "  Chiave $idx scritta" >&2
                  idx=$((idx+1))
                fi
              done
            } > "$KEYS_CONF"
            chmod 600 "$KEYS_CONF"

            key_count=$(grep -v '^\s*#' "$KEYS_CONF" | grep -v '^\s*$' | wc -l)
            echo "Pool scritto: $key_count chiave/i"

            echo ""
            echo "── Ricarica pool nel proxy Gemini ──"
            if curl -sf http://127.0.0.1:9625/proxy/reload > /dev/null; then
              status=$(curl -s http://127.0.0.1:9625/proxy/status)
              echo "Proxy aggiornato: $status"
            else
              echo "::warning::Proxy non raggiungibile — verrà caricato al prossimo avvio"
              # Assicura che il proxy sia in esecuzione
              sudo systemctl start hermes-gemini-proxy || true
            fi

            echo ""
            echo "── Stato finale ──"
            curl -s http://127.0.0.1:9625/proxy/status || echo "Proxy status non disponibile"
            echo "hermes-lightrag: $(systemctl is-active hermes-lightrag 2>/dev/null || echo 'unknown')"
            echo "hermes-gemini-proxy: $(systemctl is-active hermes-gemini-proxy 2>/dev/null || echo 'unknown')"
        env:
          KEY1: ${{ secrets.GOOGLE_API_KEY_1 }}
          KEY2: ${{ secrets.GOOGLE_API_KEY_2 || 'SKIP' }}
          KEY3: ${{ secrets.GOOGLE_API_KEY_3 || 'SKIP' }}
          KEY4: ${{ secrets.GOOGLE_API_KEY_4 || 'SKIP' }}
          KEY5: ${{ secrets.GOOGLE_API_KEY_5 || 'SKIP' }}
